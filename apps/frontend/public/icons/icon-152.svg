<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 152" width="152" height="152">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16191f"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="152" height="152" rx="21" fill="url(#bg)"/>
  <!-- Outer border glow -->
  <rect x="3" y="3" width="146" height="146" rx="18" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.35"/>
  <!-- Fridge body -->
  <rect x="33" y="27" width="85" height="98" rx="6" fill="#1a1d24" stroke="#2a2d35" stroke-width="1"/>
  <!-- Freezer compartment -->
  <rect x="33" y="27" width="85" height="27" rx="6" fill="#14161a" stroke="#2a2d35" stroke-width="1"/>
  <!-- Divider line -->
  <line x1="33" y1="54" x2="118" y2="54" stroke="#2a2d35" stroke-width="1"/>
  <!-- Door handle — cyan accent -->
  <rect x="112" y="58" width="6" height="29" rx="3" fill="#4fc3f7" filter="url(#glow)"/>
  <!-- LED strip top glow -->
  <rect x="46" y="58" width="59" height="2" rx="1" fill="#4fc3f7" opacity="0.7" filter="url(#glow)"/>
  <!-- COLOC text (simplified as accent line) -->
  <line x1="45" y1="98" x2="85" y2="98" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>