<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16191f"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="72" height="72" rx="12" fill="url(#bg)"/>
  <!-- Outer border glow -->
  <rect x="2" y="2" width="68" height="68" rx="10" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.35"/>
  <!-- Fridge body -->
  <rect x="15" y="12" width="40" height="46" rx="3" fill="#1a1d24" stroke="#2a2d35" stroke-width="1"/>
  <!-- Freezer compartment -->
  <rect x="15" y="12" width="40" height="12" rx="3" fill="#14161a" stroke="#2a2d35" stroke-width="1"/>
  <!-- Divider line -->
  <line x1="15" y1="24" x2="55" y2="24" stroke="#2a2d35" stroke-width="1"/>
  <!-- Door handle — cyan accent -->
  <rect x="53" y="26" width="2" height="13" rx="1" fill="#4fc3f7" filter="url(#glow)"/>
  <!-- LED strip top glow -->
  <rect x="21" y="26" width="28" height="1" rx="0" fill="#4fc3f7" opacity="0.7" filter="url(#glow)"/>
  <!-- COLOC text (simplified as accent line) -->
  <line x1="21" y1="44" x2="39" y2="44" stroke="#4fc3f7" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>