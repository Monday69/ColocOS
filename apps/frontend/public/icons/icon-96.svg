<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16191f"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="96" height="96" rx="13" fill="url(#bg)"/>
  <!-- Outer border glow -->
  <rect x="2" y="2" width="92" height="92" rx="11" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.35"/>
  <!-- Fridge body -->
  <rect x="21" y="17" width="53" height="62" rx="3" fill="#1a1d24" stroke="#2a2d35" stroke-width="1"/>
  <!-- Freezer compartment -->
  <rect x="21" y="17" width="53" height="17" rx="3" fill="#14161a" stroke="#2a2d35" stroke-width="1"/>
  <!-- Divider line -->
  <line x1="21" y1="34" x2="74" y2="34" stroke="#2a2d35" stroke-width="1"/>
  <!-- Door handle — cyan accent -->
  <rect x="71" y="36" width="3" height="18" rx="1" fill="#4fc3f7" filter="url(#glow)"/>
  <!-- LED strip top glow -->
  <rect x="29" y="36" width="37" height="1" rx="0" fill="#4fc3f7" opacity="0.7" filter="url(#glow)"/>
  <!-- COLOC text (simplified as accent line) -->
  <line x1="28" y1="61" x2="53" y2="61" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>