<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16191f"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="144" height="144" rx="20" fill="url(#bg)"/>
  <!-- Outer border glow -->
  <rect x="3" y="3" width="138" height="138" rx="17" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.35"/>
  <!-- Fridge body -->
  <rect x="31" y="25" width="80" height="93" rx="5" fill="#1a1d24" stroke="#2a2d35" stroke-width="1"/>
  <!-- Freezer compartment -->
  <rect x="31" y="25" width="80" height="26" rx="5" fill="#14161a" stroke="#2a2d35" stroke-width="1"/>
  <!-- Divider line -->
  <line x1="31" y1="51" x2="111" y2="51" stroke="#2a2d35" stroke-width="1"/>
  <!-- Door handle — cyan accent -->
  <rect x="106" y="54" width="5" height="27" rx="2" fill="#4fc3f7" filter="url(#glow)"/>
  <!-- LED strip top glow -->
  <rect x="43" y="55" width="56" height="2" rx="1" fill="#4fc3f7" opacity="0.7" filter="url(#glow)"/>
  <!-- COLOC text (simplified as accent line) -->
  <line x1="43" y1="92" x2="80" y2="92" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>