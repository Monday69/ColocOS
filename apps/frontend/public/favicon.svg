<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ColocOS">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="74%">
      <stop offset="0%" stop-color="#0b3350"/>
      <stop offset="46%" stop-color="#051426"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2f9fd6"/>
      <stop offset="42%" stop-color="#0b6f9e"/>
      <stop offset="100%" stop-color="#053b57"/>
    </linearGradient>

    <linearGradient id="freezer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.30"/>
      <stop offset="22%" stop-color="#e0f2fe" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fdff"/>
      <stop offset="100%" stop-color="#8fd9f7"/>
    </linearGradient>

    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Fond plein opaque (obligatoire iOS) -->
  <rect width="512" height="512" fill="#020617"/>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Liseré discret -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="#0ea5e9" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Halo cyan derrière le meuble -->
  <ellipse cx="256" cy="264" rx="142" ry="160" fill="#0ea5e9" opacity="0.26" filter="url(#soft)"/>

  <!-- Corps du réfrigérateur (rayon utile ~69 %) -->
  <rect x="168" y="102" width="176" height="308" rx="30" fill="url(#body)"/>
  <rect x="168" y="102" width="176" height="308" rx="30" fill="url(#sheen)"/>
  <rect x="168" y="102" width="176" height="308" rx="30" fill="none"
        stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- Porte congélateur (haut) -->
  <path d="M198 102 h116 a30 30 0 0 1 30 30 v58 h-176 v-58 a30 30 0 0 1 30 -30 z" fill="url(#freezer)"/>

  <!-- Séparation double porte -->
  <line x1="168" y1="216" x2="344" y2="216" stroke="#020617" stroke-opacity="0.60" stroke-width="5"/>

  <!-- Poignées fines -->
  <rect x="313" y="146" width="7" height="46" rx="3.5" fill="url(#handle)"/>
  <rect x="313" y="246" width="7" height="88" rx="3.5" fill="url(#handle)"/>

  <!-- Onde connectée cyan néon -->
  <path d="M197 346 q16 -19 32 0 t32 0 q16 -19 32 0"
        fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" filter="url(#neon)"/>
  <circle cx="293" cy="346" r="6.5" fill="#bae6fd" filter="url(#neon)"/>

  <!-- Pieds -->
  <rect x="196" y="408" width="18" height="11" rx="5.5" fill="#04293c"/>
  <rect x="298" y="408" width="18" height="11" rx="5.5" fill="#04293c"/>
</svg>
